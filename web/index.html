<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconstrucción 3D - Jarrón de Flores | Spatial AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111115;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      color: #00f2fe;
    }

    p {
      font-size: 0.85rem;
      color: #cccccc;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background: #00f2fe22;
      color: #00f2fe;
      border: 1px solid #00f2fe55;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    #status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #00f2fe;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Cargar Three.js y dependencias -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>

  <div id="info-panel">
    <span class="badge">Spatial AI & 3D Reconstruction</span>
    <h1>Jarrón de Flores (Point Cloud)</h1>
    <p>Reconstrucción 3D generada a partir de fotografías usando Structure-from-Motion (COLMAP) y procesamiento en la nube.</p>
    <div id="status">⏳ Cargando modelo 3D...</div>
    <p style="font-size: 0.75rem; color: #888; margin-top: 10px;">💡 Usa el clic izquierdo/pantalla táctil para rotar y la rueda para hacer zoom.</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('status');

    // 1. Escena, Cámara y Renderizador
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.001, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 2. Controles de Órbita
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Cargar el archivo .ply
    const loader = new THREE.PLYLoader();
    
    // Probar ambas rutas comunes por compatibilidad de mayúsculas/minúsculas
    const plyPath = './Model/jarron_flores.ply';

    loader.load(
      plyPath,
      function (geometry) {
        geometry.computeVertexNormals();
        geometry.center(); // Centrar origen en (0,0,0)

        // Ajustar tamaño de puntos para que sean visibles
        const material = new THREE.PointsMaterial({
          size: 0.04,
          vertexColors: geometry.hasAttribute('color')
        });

        const pointCloud = new THREE.Points(geometry, material);
        scene.add(pointCloud);

        // Ajustar cámara al tamaño delimitador del objeto
        geometry.computeBoundingSphere();
        const sphere = geometry.boundingSphere;
        if (sphere) {
          const radius = sphere.radius;
          camera.position.set(0, 0, radius * 2.5);
          controls.target.set(0, 0, 0);
          controls.update();
        }

        statusText.innerHTML = "✅ Modelo 3D cargado con éxito";
        statusText.style.color = "#00ff88";
      },
      function (xhr) {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          statusText.innerHTML = `⏳ Cargando modelo: ${percent}%`;
        }
      },
      function (error) {
        console.error('Error cargando PLY:', error);
        statusText.innerHTML = "❌ Error cargando el archivo .ply. Revisa la ruta o las mayúsculas.";
        statusText.style.color = "#ff4444";
      }
    );

    // 4. Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    // 5. Animación Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
