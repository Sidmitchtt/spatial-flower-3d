<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconstrucción 3D - Jarrón de Flores | Spatial AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111115;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      color: #00f2fe;
    }

    p {
      font-size: 0.85rem;
      color: #cccccc;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background: #00f2fe22;
      color: #00f2fe;
      border: 1px solid #00f2fe55;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Cargar Three.js y OrbitControls desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>

  <div id="info-panel">
    <span class="badge">Spatial AI & 3D Reconstruction</span>
    <h1>Jarrón de Flores (Point Cloud)</h1>
    <p>Reconstrucción 3D generada a partir de fotografías usando Structure-from-Motion (COLMAP) y procesamiento en la nube.</p>
    <p style="font-size: 0.75rem; color: #888;">💡 Usa el clic izquierdo/pantalla táctil para rotar y la rueda para hacer zoom.</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    // 1. Configuración de la escena, cámara y renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 2. Controles de órbita (Mouse / Táctil)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Cargar el archivo .ply generado
    const loader = new THREE.PLYLoader();
    loader.load(
      './Model/jarron_flores.ply',
      function (geometry) {
        geometry.computeVertexNormals();

        // Material para renderizar la nube de puntos 3D
        const material = new THREE.PointsMaterial({
          size: 0.015,
          vertexColors: true
        });

        const pointCloud = new THREE.Points(geometry, material);
        
        // Centrar el modelo automáticamente
        geometry.center();
        scene.add(pointCloud);

        console.log('✅ Modelo 3D cargado correctamente');
      },
      function (xhr) {
        console.log((xhr.loaded / xhr.total * 100) + '% cargado');
      },
      function (error) {
        console.error('❌ Error cargando el archivo PLY:', error);
      }
    );

    // 4. Luces ambientales
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    // 5. Loop de animación
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionar ventana
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
