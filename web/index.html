<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconstrucción 3D - Catálogo Floral | Spatial AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111115;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      color: #00f2fe;
    }

    p {
      font-size: 0.85rem;
      color: #cccccc;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background: #00f2fe22;
      color: #00f2fe;
      border: 1px solid #00f2fe55;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    #status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #00f2fe;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Librerías WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>

  <div id="info-panel">
    <span class="badge">Spatial AI & 3D Catalog</span>
    <h1>Ramo de Rosas (Aislado 3D)</h1>
    <p>Visualizador 3D de catálogo comercial filtrado dinámicamente en WebGL.</p>
    <div id="status">⏳ Cargando y filtrando modelo...</div>
    <p style="font-size: 0.75rem; color: #888; margin-top: 10px;">💡 Clic izquierdo para rotar | Rueda para zoom.</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('status');

    // 1. Configuración de Escena, Cámara y Renderizador
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.001, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 2. Controles de Órbita
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Cargar y Filtrar el Archivo PLY
    const loader = new THREE.PLYLoader();
    const plyPath = './Model/ramo_denso.ply';

    loader.load(
      plyPath,
      function (geometry) {
        geometry.computeVertexNormals();
        geometry.center(); // Centra el centroide en (0,0,0)

        // Calcular la esfera delimitadora para obtener la escala real del modelo
        geometry.computeBoundingSphere();
        const maxRadius = geometry.boundingSphere.radius;

        const positions = geometry.attributes.position;
        const colors = geometry.attributes.color;

        const filteredPositions = [];
        const filteredColors = [];

        // Conservar únicamente el 35% interno del radio total (donde se concentra el ramo)
        const CROP_RATIO = 0.35; 
        const cutoffRadius = maxRadius * CROP_RATIO;

        for (let i = 0; i < positions.count; i++) {
          const x = positions.getX(i);
          const y = positions.getY(i);
          const z = positions.getZ(i);

          const distance = Math.sqrt(x * x + y * y + z * z);

          if (distance <= cutoffRadius) {
            filteredPositions.push(x, y, z);
            if (colors) {
              filteredColors.push(colors.getX(i), colors.getY(i), colors.getZ(i));
            }
          }
        }

        // Crear geometría filtrada
        const cleanGeometry = new THREE.BufferGeometry();
        cleanGeometry.setAttribute('position', new THREE.Float32BufferAttribute(filteredPositions, 3));
        if (colors) {
          cleanGeometry.setAttribute('color', new THREE.Float32BufferAttribute(filteredColors, 3));
        }

        // Ajustar el tamaño de los puntos proporcional a la escala del modelo
        const material = new THREE.PointsMaterial({
          size: maxRadius * 0.008,
          vertexColors: cleanGeometry.hasAttribute('color'),
          sizeAttenuation: true
        });

        const pointCloud = new THREE.Points(cleanGeometry, material);
        scene.add(pointCloud);

        // Enfocar la cámara dinámicamente según el tamaño del ramo
        camera.position.set(0, cutoffRadius * 0.5, cutoffRadius * 2.2);
        controls.target.set(0, 0, 0);
        controls.update();

        statusText.innerHTML = "✅ Ramo aislado cargado con éxito";
        statusText.style.color = "#00ff88";
      },
      function (xhr) {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          statusText.innerHTML = `⏳ Filtrando y cargando: ${percent}%`;
        }
      },
      function (error) {
        console.error('Error cargando el archivo PLY:', error);
        statusText.innerHTML = "❌ Error al cargar ramo_denso.ply";
        statusText.style.color = "#ff4444";
      }
    );

    // 4. Luces ambientales
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    // 5. Bucle de Renderizado
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
